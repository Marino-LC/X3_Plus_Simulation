# nav2_params.yaml — ROS 2 Jazzy — homologado con el gemelo digital
#
# Parámetros reales del robot segun mecanum_kinematic_node.py y ag_motion_tests.py:
#   wheel_radius r        = 0.040 m
#   lx, ly                = 0.110, 0.102 m   (k = lx+ly = 0.212 m)
#   max_wheel_vel         = 25 rad/s  -> 1.0 m/s por rueda (límite de seguridad)
#   motor_tau             = 0.5797 s  (dinámica electromecánica identificada)
#   control_rate PID      = 100 Hz ;  cmd_vel_timeout = 0.5 s
#   Velocidades validadas = VX_REF 0.40 m/s, WZ_REF 1.00 rad/s
#   Tolerancias validadas = POS_TOL 0.04 m, YAW_TOL 0.05 rad
#   Lazo de pruebas       = CTRL_DT 0.05 s (20 Hz)
#   Spawn                 = (0, -0.91), yaw = pi/2 (launch: -Y 1.570796; odom reset yaw = pi/2)
#
# Chequeo de saturación: vx=0.40 + wz=1.0 -> (0.40 + 0.212*1.0)/0.04 = 15.3 rad/s < 25 rad/s  OK

amcl:
  ros__parameters:
    use_sim_time: True
    # Base mecanum = holonómica: modelo de movimiento omnidireccional (usa alpha1..alpha5)
    robot_model_type: "nav2_amcl::OmniMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: /scan
    map_topic: /map
    min_particles: 200
    max_particles: 1000
    laser_model_type: "likelihood_field"
    laser_max_range: 30
    laser_min_range: 0.05
    max_beams: 60
    set_initial_pose: true
    always_reset_initial_pose: true
    # Pose inicial debe coincidir con el spawn real: (0, -0.91) mirando a +Y (yaw = pi/2).
    initial_pose:
      x: 0.0
      y: -0.91
      z: 0.0
      yaw: 1.5708
    transform_tolerance: 1.0
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    tf_broadcast: true

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    goal_blackboard_id: "goal"
    path_blackboard_id: "path"
    # Reduce el tiempo que el robot se queda intentando recuperar
    error_code_names: ["follow_path_error_code", "compute_path_error_code"]

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.05          # ~POS_TOL
      use_astar: true
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0          # = 1/CTRL_DT de las pruebas del AG
    min_x_velocity_threshold: 0.002     # = error_deadband_mm_s del nodo cinemático (2 mm/s)
    min_y_velocity_threshold: 0.002
    min_theta_velocity_threshold: 0.002
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
 
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03
      movement_time_allowance: 15.0     # holgura por zona muerta / arranque (breakaway)
 
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05           # POS_TOL = 0.04 m + margen
      yaw_goal_tolerance: 0.10          # 2 x YAW_TOL
      stateful: true
 
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # ── Límites de velocidad: los validados en la batería P1-P3 ──
      min_vel_x: -0.40
      max_vel_x:  0.40
      # Gazebo no desplaza lateralmente las mecanum (mallas sin rodillos) -> vy = 0 en simulación.
      # En el robot real (P1y validada a 0.40 m/s) usar:
      #   min_vel_y: -0.40 / max_vel_y: 0.40 / vy_samples: 10 / acc_lim_y: 0.6 / decel_lim_y: -0.6
      min_vel_y: 0.0
      max_vel_y: 0.0
      min_vel_theta: -1.0
      max_vel_theta:  1.0
      min_speed_xy:   0.10
      max_speed_xy:   0.40
      min_speed_theta: 0.30
      # ── Aceleraciones: acotadas por motor_tau = 0.58 s (v/tau ≈ 0.4/0.58 ≈ 0.7 m/s²) ──
      acc_lim_x:      0.6
      acc_lim_y:      0.0
      acc_lim_theta:  1.5
      decel_lim_x:   -0.6
      decel_lim_y:    0.0
      decel_lim_theta: -1.5
      vx_samples:     10
      vy_samples:     1
      vtheta_samples: 10
      sim_time: 1.5                      # cubre el retardo del motor (tau)
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.05            # igual que goal_checker
      short_circuit_trajectory_eval: true
      critics: ["RotateToGoal","Oscillation","BaseObstacle","GoalAlign","PathAlign","PathDist","GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale:    32.0
      GoalAlign.scale:    24.0
      PathDist.scale:     32.0
      GoalDist.scale:     24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# Footprint: ruedas a lx=0.110 / ly=0.102 desde el centro.
#   x delantero: 0.15 ; x trasero: -0.18 (la malla base_link.STL llega a x = -0.176)
#   y: ly + ~medio ancho de rueda ≈ 0.12
# Radio circunscrito = hypot(0.18, 0.12) ≈ 0.216 m -> inflation_radius 0.22.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width:  2
      height: 2
      resolution: 0.02
      footprint: "[ [0.15, 0.12], [0.15, -0.12], [-0.18, -0.12], [-0.18, 0.12] ]"
      # (antes había dos claves 'plugins'; YAML se queda con la última y se perdía la primera)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.8
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.22          # radio circunscrito ≈ 0.216 m
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 1.0 # Tolerancia de transformación de TF
      global_frame: map # El valor del global frame no es odom, es map 
      robot_base_frame: base_footprint
      # Mismo footprint que el local (antes: robot_radius 0.15, inconsistente)
      footprint: "[ [0.15, 0.12], [0.15, -0.12], [-0.18, -0.12], [-0.18, 0.12] ]"
      resolution: 0.02
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.8
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.22
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True
 
map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "maps/arena_map.yaml"
 
map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
 
slam_toolbox:
  ros__parameters:
    use_sim_time: True
 
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
 
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
 
    resolution: 0.02
    max_laser_range: 4.0
    min_laser_range: 0.15
    scan_buffer_maximum_scan_distance: 4.0
    scan_buffer_size: 20
 
    transform_publish_period: 0.02
    map_update_interval: 0.5
    minimum_time_interval: 0.1
    minimum_travel_distance: 0.03
    minimum_travel_heading: 0.03
 
    use_scan_matching: true
    use_scan_barycenter: true
    distance_variance_penalty: 0.1
    angle_variance_penalty: 0.1
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    do_loop_closing: true
 
behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0             # = WZ_REF
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5
 
smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
 
# NOTA: estos límites solo tienen efecto si velocity_smoother está en la cadena de
# /cmd_vel (ver remapeos sugeridos en el launch).
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity:    [ 0.40,  0.40,  1.0]
    min_velocity:    [-0.40, -0.40, -1.0]
    max_accel:       [ 0.6,   0.6,   1.5]
    max_decel:       [-0.6,  -0.6,  -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.002, 0.002, 0.002]
    velocity_timeout: 0.5               # = cmd_vel_timeout del nodo cinemático
 
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: []
    observation_sources: []
 
waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0
 
lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    autostart: true
    node_names:
      - map_server
      - amcl
      - planner_server
      - controller_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      # - collision_monitor